ight:500;color:#555;font-size:.8rem}.badge{font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:99px;white-space:nowrap}.badge.pass{background:#dff3e4;color:#1e7a38}.badge.fail{background:#fbdcdc;color:#a3261c}.badge.prog{background:#fff1d6;color:#8a5a00}.badge.new{background:#e8ecf1;color:#555}.card.needs{border-color:#c0392b;background:#fff7f7}.card.watch{border-color:#c9a227;background:#fffaf0}.card.pass{border-color:#2e8b47}.bar{height:8px;background:#e6e8ec;border-radius:99px;overflow:hidden;margin:8px 0}.bar>span{display:block;height:100%;background:#1d3b6a}.card.needs .bar>span{background:#c0392b}.card.watch .bar>span{background:#b8860b}.card.pass .bar>span{background:#2e8b47}.foot{margin:6px 2px 18px}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}section,button,article.card{background:#1e1e1e;color:#eee}.info{background:#1b2a40}.warn{background:#3a2e12}.good{background:#163322}.opt.ok{background:#163322}.opt.bad,.danger{background:#3d1a1a}.cite,.meta,.hint{color:#aaa}td,th{border-color:#333}.badge.new{background:#2a2a2a;color:#ccc}.badge.prog{background:#3a2e12;color:#f0d48a}.badge.pass{background:#163322;color:#8dcea0}.badge.fail{background:#3d1a1a;color:#f0a8a2}.card.needs{background:#2a1515;border-color:#c0392b}.card.watch{background:#2a2414;border-color:#c9a227}.card.pass{border-color:#2e8b47}.bar{background:#333}button.pri{color:#fff}}

];
const HW = "ITD POE Hazmat & Placards Worksheet p.";
const ZW = "ITD POE Size Worksheet p.";

const SG = "Weight study guide (study-guide.pdf)";

const C = "49 CFR ";

const M = "POE Manual ";
const ID = "IDAPA 39.03.01";
const BANK = [
  ["wt", "On the interstate, a tandem axle hauling a LOW-bridge commodity (such as salt blocks, french fries, steel or gasoline) is limited to what weight?", "34,000 lbs", ["37,800 lbs", "40,000 lbs", "43,500 lbs"], "Worksheet #2 match.", "I.C. 49-1001(1); ITD POE Weight Worksheet p.1-2"],
  ["wt", "On the interstate, which of these commodities qualifies as a HIGH-bridge commodity, allowing a 37,800 lbs tandem?", "Sugar beets", ["Steel", "French fries", "Salt blocks"], "Worksheet #2 match; water w/ live fish and alfalfa pellets also high.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.1-2"],
  ["wt", "A truck is hauling grass seed that will be used for golf course sod, not for farm use. For weight purposes, how is this load treated?", "As a high-bridge commodity, because grass seed is on the list", ["As a low-bridge commodity, because it is not for farm use", "As exempt from bridge weight limits", "As needing an overweight permit before it can move"], "Worksheet #3: per commodity list.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.2"],
  ["wt", "When measuring axle spacing, a measurement that ends in exactly 6 inches (such as 10 ft 6 in) is rounded up to the next whole foot. True or false?", "True", ["False"], `A spacing of exactly XX ft 6 in is rounded up (e.g., 10'6" counts as 11 ft); the worksheet statement that it is rounded down is false.`, "I.C. 49-1001(5); ITD POE Weight Worksheet p.2, p.14"],
  ["wt", "On the interstate, what is the maximum weight allowed on a tandem axle carrying a HIGH-bridge commodity?", "37,800 lbs", ["34,000 lbs", "40,000 lbs", "36,000 lbs"], "Worksheet #7.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.3"],
  ["wt", "A truck has two single axles spaced 10 feet apart (a spread axle). What is the maximum legal weight for this axle pair?", "40,000 lbs", ["38,000 lbs", "42,000 lbs", "37,800 lbs"], "Worksheets #8 and Review #1.", "I.C. 49-1001(9); ITD POE Weight Worksheet p.3, p.14"],
  ["wt", "What is the maximum weight per inch of tire width for non-steer tires on a vehicle built before July 1, 1987, and on one built on or after that date?", "800 lbs per inch before; 600 lbs per inch on or after", ["600 lbs per inch before; 800 lbs per inch on or after", "800 lbs per inch before; 700 lbs per inch on or after", "900 lbs per inch for both"], "Worksheet #9, a trick question.", "I.C. 49-1002(1); ITD POE Weight Worksheet p.3"],
  ["wt", "Which list contains ONLY high-bridge commodities?", "Peat moss, unprocessed salt, stone, fur-bearing animals", ["Farm equipment, machinery, scrap iron, explosives", "Cheese, french fries, steel", "Meat, salt blocks, gasoline"], "Worksheet #10.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.3; ITD DMV/POE Policy Manual 105.3"],
  ["wt", "Which list contains ONLY low-bridge commodities?", "Farm equipment, machinery, scrap iron, explosives", ["Peat moss, unprocessed salt, stone", "Sugar beets, grass seed", "Potato waste, alfalfa pellets"], "Worksheet #11.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.3; ITD DMV/POE Policy Manual 105.3"],
  ["wt", "When a truck is being weighed on a platform scale, the driver should hold the brakes on. True or false?", "False", ["True"], "Worksheet #13 and Review #2.", "ITD POE Weight Worksheet p.3, p.14"],
  ["wt", "For a steer axle, the legal weight limit is the LOWEST of which three values?", "Tire rating, axle rating, or 20,000 lbs", ["Tire rating, registered weight, or 34,000 lbs", "Axle rating, bridge formula, or 24,000 lbs", "Tire rating, axle rating, or 600 lbs per inch"], "Worksheets #14, #21.", "I.C. 49-1002; ITD POE Weight Worksheet p.4, p.6"],
  ["wt", "An 8-axle combination on I-84 has 95 ft between its first and last axles and carries an EL/EW 129,000 lbs permit. What is its maximum exterior bridge weight?", "120,000 lbs", ["121,000 lbs", "105,500 lbs", "125,500 lbs"], "Worksheets #16, #27.", "I.C. 49-1001(1); ITD POE Weight Worksheet p.4, p.9"],
  ["wt", "A truck has an annual overweight permit for purple routes and is loaded to 48,000 lbs on a tandem. May it travel on green routes under that permit?", "No; green routes cap the tandem at 43,500 lbs, so it must stay on purple/black routes or get a single-trip permit", ["Yes, an annual purple permit covers all lower route colors", "Yes, if a pilot car accompanies it", "Yes, but only at night"], "Worksheets #18-19.", "IDAPA 39.03.01.308.05; ITD POE Weight Worksheet p.6"],
  ["wt", "A 1999 truck has 295/75R22.5 non-steer tires (295 mm = about 11.61 inches) and the 600 lb-per-inch rule applies. About how much weight may each tire carry?", "About 6,966 lbs", ["About 5,800 lbs", "About 9,280 lbs", "About 7,440 lbs"], "Worksheet #20 circled 6,960 (rounded 11.6 in).", "I.C. 49-1002; ITD POE Weight Worksheet p.6"],
  ["wt", "A vehicle hauling six 10-ft-wide tires weighs 82,640 lbs gross, and every axle is legal. Which permits does it need?", "A non-reducible oversize permit and an EL/EW permit up to 129,000 lbs", ["A non-reducible oversize permit only", "A reducible oversize permit and an EL/EW permit", "An EL/EW permit only"], "Worksheet #22; POE/MC 11-22 FYI memo.", "I.C. 49-1004(1); ITD POE Weight Worksheet p.7"],
  ["wt", "A 10-axle combination weighs 119,260 lbs, is registered for 120,000 lbs, and has no permit. Which code section is violated, and what permit does it need?", "I.C. 49-1004; an EL/EW permit up to 129,000 lbs", ["I.C. 49-1010(3); a reducible oversize permit", "I.C. 49-1001(3); an EL/EW permit", "I.C. 49-1004(3); a 192,000 lbs permit"], "Worksheet #23.", "I.C. 49-1004(1); ITD POE Weight Worksheet p.8"],
  ["wt", "A city refuse (trash) truck is weighed with 39,700 lbs on a tandem whose legal limit is 37,800 lbs. What action do you take?", "No citation; I.C. 49-1011(3) allows it up to 2,000 lbs over", ["Cite under I.C. 49-1001(9)", "Park the truck until it is offloaded", "Cite and sell a travel authorization"], "Worksheet #25.", "I.C. 49-1011(3); ITD POE Weight Worksheet p.8"],
  ["wt", "On US-95 between the Oregon border and Payette, an 8-axle combination has 79 ft between its first and last axles. What is its maximum LEGAL gross weight (without a permit)?", "105,500 lbs", ["121,000 lbs", "120,000 lbs", "125,500 lbs"], "Worksheet #28; permitted max 129,000.", "I.C. 49-1001(1); ITD POE Weight Worksheet p.9"],
  ["wt", "In an extra-length combination, a trailer may not be more than how much heavier than the trailer ahead of it?", "4,000 lbs", ["2,000 lbs", "3,500 lbs", "4,500 lbs"], "Worksheets #30 and Review #3.", "IDAPA 39.03.01.202.04; ITD POE Weight Worksheet p.10, p.14"],
  ["wt", "A truck has several weight violations at once. In what order of priority are they addressed?", "Axle, bridge, gross", ["Gross, axle, bridge", "Bridge, gross, axle", "Gross only"], "Worksheet #31.", "I.C. 49-1011; ITD POE Weight Worksheet p.10; ITD DMV/POE Policy Manual 105.2"],
  ["wt", "A truck is 7% or more overweight and the driver cannot shift or adjust the load at the port. What is the correct action?", "Cite and sell a travel authorization to the nearest safe place to unload", ["Cite and release the truck to continue", "Cite and sell a weight increase permit to the destination", "Cite, sell a travel authorization, and sell a weight increase permit"], "I.C. 49-1001(8): at 7% or more over, the vehicle may not proceed past the place of weighing; a load that cannot be adjusted there needs a travel authorization to the nearest place of safe unloading. Worksheet #32.", "I.C. 49-1001(8); ITD POE Weight Worksheet p.10"],
  ["wt", "A truck is found to be more than 15% overweight. What is the correct action?", "Park it until the weight is brought under the threshold", ["Sell a travel authorization", "Cite and release", "Sell an overweight permit"], "Worksheet #33.", "I.C. 49-1001(8); ITD POE Weight Worksheet p.10"],
  ["wt", "Using the bridge chart, what is the maximum weight for a group of 4 axles spaced 14 ft 1 in from first to last axle?", "51,500 lbs", ["42,500 lbs", "56,000 lbs", "50,000 lbs"], "Worksheet #35.", "I.C. 49-1001 bridge chart; ITD POE Weight Worksheet p.11"],
  ["wt", "Using the bridge chart, what is the maximum weight for a group of 3 axles spaced 9 ft 1 in from first to last axle?", "42,500 lbs", ["43,500 lbs", "40,000 lbs", "34,000 lbs"], "Worksheet #35.", "I.C. 49-1001(1); ITD POE Weight Worksheet p.11"],
  ["wt", "At a port of entry, a travel authorization is needed when a vehicle's axle-combination or gross weight is at or above what percent over its legal limit and the load cannot be brought into compliance at the port?", "7% or more", ["5% or more", "10% or more", "15% or more"], "I.C. 49-1001(8): at 7% or more over on an axle combination or gross weight, the vehicle may not proceed past the place of weighing until brought into compliance; loads that are unsafe or impractical to adjust there need a travel authorization to the nearest place of safe unloading or adjustment. Worksheet review #6.", "I.C. 49-1001(8); ITD POE Weight Worksheet p.14"],
  ["wt", "On the interstate, what is the maximum legal gross weight for a reducible (divisible) load without a permit?", "80,000 lbs", ["79,000 lbs", "129,000 lbs", "105,000 lbs"], "Review #7.", "I.C. 49-1001(1); ITD POE Weight Worksheet p.15"],
  ["wt", "Which of these loads is a HIGH-bridge commodity?", "Christmas trees", ["Meat", "French fries", "Salt"], "Review #8.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.15"],
  ["wt", "Which of these loads is a LOW-bridge commodity?", "Cheese", ["Grain", "Potatoes", "Onions"], "Review #9.", "I.C. 49-1001(2); ITD POE Weight Worksheet p.15"],
  ["wt", "Under I.C. 49-1001, what is the maximum gross weight allowed on a single axle?", "20,000 lbs", ["10,000 lbs", "22,000 lbs", "34,000 lbs"], "The maximum single axle gross weight is 20,000 lbs.", "I.C. 49-1001"],
  ["wt", "Off the interstate and without a permit, what is the maximum gross weight for a vehicle or combination in Idaho?", "105,500 lbs", ["80,000 lbs", "129,000 lbs", "106,000 lbs"], "Max GVW/combination weight is 105,500 lbs.", "I.C. 49-1001"],
  ["wt", "When using the bridge formula, the result W (maximum weight) is rounded to the nearest what?", "500 pounds", ["100 pounds", "1,000 pounds", "50 pounds"], "W is the max weight in pounds to the nearest 500 lbs.", "I.C. 49-1001(1)"],
  ["wt", "Under the table in I.C. 49-1001(1), how much weight may two axles carry when they are more than 8 feet apart?", "38,000 lbs", ["34,000 lbs", "39,000 lbs", "42,000 lbs"], "8+ ft: 2 axles 38,000 lbs; 3 axles 42,000 lbs.", "I.C. 49-1001(1) table"],
  ["wt", "On the interstate, the higher weights in the I.C. 49-1001(2) table may be used only for certain commodities. Which of these is one of them?", "Logs, pulp wood, poles or piling", ["Furniture", "Electronics", "Steel coils"], "Logs, pulp wood, stull, rough lumber, poles, piling; ores, concentrates, sand & gravel in bulk; agricultural commodities incl. livestock.", "I.C. 49-1001(2)"],
  ["wt", "I.C. 49-1001 has weight tables in subsections (1), (2) and (9). How must a vehicle use them?", "It must comply with one table only, either (1), (2) or (9)", ["It must comply with all three tables at once", "It must always use subsection (1)", "It uses whichever table the inspector picks"], "A vehicle complies exclusively with (1) or (2) or (9).", "I.C. 49-1001(4)"],
  ["wt", "At a port, a vehicle may not continue past the place of weighing if its axle-combination or gross weight is over the limit by how much?", "7% or more", ["5% or more", "10% or more", "15% or more"], "7% or more over must be brought into compliance at the place of weighing.", "I.C. 49-1001(8)"],
  ["wt", "On a vehicle with a variable load suspension (VLS) axle, where must the pressure regulator valve be located?", "Outside the cab, where the driver cannot reach it", ["Inside the cab, next to the deployment switch", "On the steer axle", "Anywhere, as long as it is labeled"], "Deployment switch may be in the cab, but the pressure regulator valve must be outside and inaccessible.", "I.C. 49-1001(10)(a)"],
  ["wt", "Before an overweight or oversize vehicle may move, what must the owner or operator do?", "Obtain a permit, or a permit number from a permit office", ["Notify Idaho State Police", "Call 511 for road conditions", "Arrange a pilot car"], "Must obtain a permit or establish intent by receiving a permit number before moving.", "I.C. 49-1004(1)(b)"],
  ["wt", "In the I.C. 49-1004 permit fee schedule, what is the Column 1 starting weight for a 3-axle vehicle?", "54,001 lbs", ["40,001 lbs", "68,001 lbs", "80,001 lbs"], "2 ax 40,001; 3 ax 54,001; 4 ax 68,001.", "I.C. 49-1004(2)"],
  ["wt", "I.C. 49-1011(3) gives certain vehicles (farm, forest products, government refuse) an extra weight allowance. How much extra weight does it allow?", "Up to 2,000 lbs", ["Up to 1,000 lbs", "Up to 4,000 lbs", "Up to 7%"], "Up to 2,000 lbs over any axle, bridge or gross limit in 49-1001.", "I.C. 49-1011(3)"],
  ["wt", "Does the 2,000 lbs allowance under I.C. 49-1011(3) apply to posted bridge limits or seasonal (spring breakup) limits?", "No", ["Yes", "Only for farm vehicles", "Only in winter"], "Extra weight does not apply to posted bridge weights or seasonal/temporary postings.", "I.C. 49-1011(3)"],
  ["wt", "In general, what kind of offense is a violation of Idaho Code Title 49, Chapter 10 (vehicle size and weight)?", "A misdemeanor, except that the listed lower overweight tiers are infractions", ["A felony", "A civil penalty only", "An infraction in all cases"], "Misdemeanor, except 49-1013(3)(a)\u2013(c) are infractions.", "I.C. 49-1013(1)"],
  ["wt", 'Under IDAPA 39.03.01, "off-track" is defined as the difference between the paths of which two wheels when the vehicle turns?', "The first inside front wheel and the last inside rear wheel", ["The steer axle and the drive axle", "The outside front wheel and the outside rear wheel", "The kingpin and the rear axle"], "Path of first inside front wheel vs last inside rear wheel in a curve.", "IDAPA 39.03.01 (def. 15)"],
  ["wt", "Under IDAPA, a Longer Combination Vehicle (LCV) is a truck tractor with two or more trailers on the interstate whose gross weight is more than what?", "80,000 lbs", ["105,500 lbs", "26,000 lbs", "129,000 lbs"], "LCV: GVW greater than 36,288 kg (80,000 lbs).", "IDAPA 39.03.01 (def. 12)"],
  ["wt", "Under IDAPA 39.03.01, a permit becomes invalid if an axle group is more than what percent over its permitted weight?", "15%", ["7%", "10%", "5%"], "Axle groups more than 15% over; gross or bridge more than 7% over.", "IDAPA 39.03.01.108.01.c"],
  ["wt", "A carrier commits its FIRST permit violation that leads to disqualification. How long is the disqualification period?", "30 days", ["10 days", "6 months", "1 year"], "30 days, then 6 months (2nd), then 1 year (3rd).", "IDAPA 39.03.01.108.03"],
  ["wt", "Carriers with annual overweight permits must file quarterly road use reports. What mileage do these reports cover?", "Laden (loaded) miles only", ["All miles, loaded and empty", "Unladen (empty) miles only", "Gallons of fuel used instead of miles"], "Quarterly reports of laden only mileage.", "IDAPA 39.03.01.310.01"],
  ["wt", "A carrier with an annual overweight permit drove zero miles during the quarter. Must it still file a quarterly report?", "Yes", ["No", "Only for single-trip permits", "Only if it operates over 129,000 lbs"], "Report even when reporting zero miles.", "IDAPA 39.03.01.310.01.b"],
  ["wt", "For annual overweight permits, what are the maximum single, tandem and tridem axle weights on BLACK routes?", "33,000 / 56,000 / 70,500 lbs", ["30,000 / 51,500 / 64,500 lbs", "27,000 / 46,000 / 57,500 lbs", "25,500 / 43,500 / 54,500 lbs"], "Black: 33,000 single, 56,000 tandem, 70,500 tridem.", "IDAPA 39.03.01.308.08"],
  ["wt", "For annual overweight permits, what is the maximum tandem axle weight on YELLOW routes?", "38,000 lbs", ["41,000 lbs", "43,500 lbs", "34,000 lbs"], "Yellow: 22,500 single, 38,000 tandem, 48,000 tridem.", "IDAPA 39.03.01.308.03"],
  ["wt", "During spring breakup restrictions, what is the speed limit for trucks and buses of 10,000 lbs or more in posted critical areas?", "30 mph", ["25 mph", "35 mph", "45 mph"], "Max 30 mph; red marker = 30 mph, green = resume legal speed.", "IDAPA 39.03.01.106.06; ITD Overlegal Permit General Provisions 9.6"],
  ["wt", "To which roads and loads does the grandfather table in I.C. 49-1001(9) apply?", "Non-interstate highways, all commodities, up to 80,000 lbs", ["Interstate, high bridge commodities, up to 79,000 lbs", "All highways, up to 105,500 lbs", "Interstate, all commodities, up to 80,000 lbs"], "(9): non-interstate, all commodities, up to 80,000.", "I.C. 49-1001(9); ITD DMV/POE Policy Manual 105.1"],
  ["wt", "Under I.C. 49-1011(3), the 2,000 lbs allowance may be applied to how many of the weight categories (axle, bridge, gross)?", "Only one category, chosen by the operator", ["All three categories", "Two categories, chosen by the inspector", "The axle category only"], "Manual 105.2: the 2,000 lbs allowance may be taken in only ONE of the categories (axle, bridge or gross), and the operator chooses which.", "I.C. 49-1011(3); ITD DMV/POE Policy Manual 105.2"],
  ["wt", "Under Manual 105.3, which of these loads is a HIGH-bridge commodity?", "Manure (all forms)", ["Garbage", "Scrap iron", "Asphalt"], "Manure (all forms) is high.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.3"],
  ["wt", "Under Manual 105.3, which kind of milk load is a HIGH-bridge commodity?", "Bulk milk hauled from the farm to the plant", ["Packaged milk", "Cheese", "Both bulk and packaged milk"], "Milk (bulk farm to plant) high; packaged milk low.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.3"],
  ["wt", "A truck eligible for the I.C. 49-1011(3) allowance is weighed with 37,500 lbs on a tandem whose limit on the I.C. 49-1001 chart is 34,000 lbs. The operator applies the allowance to this tandem. How much overweight is the inspector cited back to?", "1,500 lbs over the allowed 36,000 lbs", ["3,500 lbs over the 34,000 lbs chart limit", "No overweight; the allowance covers up to 4,000 lbs", "1,500 lbs over, cited against the gross weight instead"], "Manual 105.2: when the violation exceeds the 2,000 lbs allowance, cite back only to the allowed weight under 49-1011(3) (34,000 + 2,000 = 36,000), not the weight shown on the 49-1001 chart.", "I.C. 49-1011(3); ITD DMV/POE Policy Manual 105.2"],
  ["wt", "An operator declares the truck's total gross is intended to be 82,000 lbs and asks to use the I.C. 49-1001(2) special-commodity axle allowances. May the operator use them?", "No; the 49-1001(2) allowances do not apply when declared gross is intended to exceed 79,000 lbs", ["Yes, as long as the load is a high-bridge commodity", "Yes, but only on non-interstate highways", "Yes, if the operator also takes the 2,000 lbs allowance in the gross category"], "49-1001(2) (quoted in Manual 105.2): the allowances do not apply if total gross is intended to exceed 79,000 lbs as declared by the operator.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.2"],
  ["wt", "A combination grossing 84,000 lbs is traveling on a non-interstate state highway in Idaho. Which weight provision governs it?", "I.C. 49-1001(1), which applies on all highways within Idaho to vehicles over 80,000 lbs", ["The I.C. 49-1001(9) grandfather table, because it is off the interstate", "The I.C. 49-1001(2) special-commodity table", "Only its registered weight, because it is off the interstate"], "Manual 105.2: all vehicles operating over 80,000 lbs are subject to 49-1001(1) on all highways within Idaho.", "I.C. 49-1001(1); ITD DMV/POE Policy Manual 105.2"],
  ["wt", "A truck is weighed 300 lbs over a legal axle limit. Because the amount is small, the driver asks to be let go. Under Manual 105.2, what must the inspector do?", "Advise the driver and take appropriate compliance action; violators over by any amount are addressed", ["Release the driver with no action, because it is under 500 lbs", "Release the driver, because a scale tolerance applies", "Have the driver sign a warning and take no compliance action"], "Manual 105.2: all violators exceeding legal weight laws, by any amount, shall be advised and appropriate compliance action taken.", "I.C. 49-1001; ITD DMV/POE Policy Manual 105.2"],
  ["wt", "On the interstate, a driver is hauling a commodity that is not on the 49-1001(2) commodity table, and its classification is unclear. Under Manual 105.3, how should the inspector decide?", "When in doubt, decide on the side of the customer", ["When in doubt, treat it as a low-bridge commodity", "Require the driver to offload until it is classified", "Always contact the district supervisor before deciding"], "Manual 105.3: the officer has discretion, but when in doubt about a commodity not on the table, decide on the side of the customer.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.3"],
  ["wt", "An inspector needs to check whether a commodity is regulated or exempt under I.C. 49-1001(2). Where does Manual 105.3 point for the list?", "The Idaho State Police CVS commodities page (isp.idaho.gov/cvs/commodities)", ["The FMCSA hazardous materials table", "The ITD Route Capacity Map", "The IRS Form 2290 instructions"], "Manual 105.3 note: visit https://isp.idaho.gov/cvs/commodities/ for regulated and exempt commodities.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.3"],
  ["wt", "I.C. 49-1001(2) sets special-commodity axle and gross weights for which vehicles?", "Vehicles with three or four axles and vehicles with five or more axles hauling certain commodities on interstate highways", ["Only five-axle combinations on all state highways", "Any vehicle over 80,000 lbs on non-interstate highways", "Only two-axle trucks hauling agricultural products"], "Manual 105.3.", "I.C. 49-1001(2); ITD DMV/POE Policy Manual 105.3"],
  ["wt", "Under Manual 105.4, citations are recommended for weight violations over how many pounds (and for habitual violators)?", "1,000 lbs", ["500 lbs", "2,000 lbs", "4,000 lbs"], "Recommended over 1,000 lbs and for habitual violators.", "ITD DMV/POE Policy Manual 105.4"],
  ["wt", "A vehicle has several weight violations, one a misdemeanor and one an infraction. Which is treated as the primary violation?", "The misdemeanor", ["The infraction", "The heaviest axle", "Driver's choice"], "Misdemeanor is primary.", "ITD DMV/POE Policy Manual 105.4"],
  ["wt", "A truck arrives at a port with heavy snow and ice built up on it. How is the snow and ice handled before weighing?", "It may not be removed at the port", ["It must be removed before weighing", "500 lbs per axle is deducted for it", "It may be removed with supervisor approval"], "Snow/ice shall not be removed at POEs; no citation if weigh bills show legal at loading.", "ITD DMV/POE Policy Manual 105.5"],
  ["wt", "A government vehicle doing emergency snow and ice control, with its amber beacons flashing, approaches an open port. Must it stop?", "No, it is exempt from stopping at ports", ["Yes, it must stop at all ports", "Only if it is over 80,000 lbs", "Only if it lacks a special permit"], "Exempt from stopping; extends to leased/contracted private vehicles.", "ITD DMV/POE Policy Manual 105.7"],
  ["wt", "How much extra weight is allowed for an auxiliary power unit (APU) or other idle-reduction device?", "550 lbs", ["400 lbs", "2,000 lbs", "500 lbs"], "550 lbs (2005 Federal Energy Bill, HR 6 Sec 756).", "23 U.S.C. 127(a)(12); ITD DMV/POE Policy Manual 105.8"],
  ["wt", "An electric battery-powered truck may carry up to 2,000 lbs extra on the power unit. What is its maximum gross weight on the interstate?", "82,000 lbs", ["80,000 lbs", "80,550 lbs", "86,000 lbs"], "Max 82,000 on interstate.", "23 U.S.C. 127(s); ITD DMV/POE Policy Manual 105.8"],
  ["wt", "For emergency vehicles, the state may not enforce a limit lower than what weight on a single drive axle?", "33,500 lbs", ["24,000 lbs", "20,000 lbs", "62,000 lbs"], "24,000 steer; 33,500 drive; 62,000 tandem; 52,000 tandem rear drive steer.", "23 U.S.C. 127(r)(1)(B); ITD DMV/POE Policy Manual 105.8"],
  ["wt", "A travel authorization (TA) is never issued without what?", "An accompanying overweight citation", ["A supervisor's call", "A pilot car", "A reweigh"], "Never issued without an overweight citation.", "I.C. 49-1001(8); ITD DMV/POE Policy Manual 105.9"],
  ["wt", "A truck is more than 15% overweight. When may a travel authorization be issued?", "Only as a last resort, with supervisor approval", ["Never", "At any time, for a $50 fee", "Only with Idaho State Police approval"], "Must legalize; TA as last resort with supervisor approval.", "I.C. 49-1001(8); ITD DMV/POE Policy Manual 105.9"],
  ["wt", "Which type of lift axle is required to be self-steering?", "Only variable load suspension (VLS) axles", ["VLS, retractable and booster axles", "All lift axles", "Booster axles only"], "Only VLS; retractable, booster, hydraulic not required.", "I.C. 49-1001(10)(c); ITD DMV/POE Policy Manual 105.16"],
  ["size", 'In Idaho size and weight rules, what does "permitted" size or weight mean?', "Beyond what is legal, allowed only by permit", ["The same as legal", "Reducible loads only", "Federal limits only"], "Worksheet #1.", "I.C. 49-1010; ITD POE Size Worksheet p.1"],
  ["size", "Under Idaho law, when is a farm tractor treated as an implement of husbandry?", "When it is towing an implement of husbandry", ["Never, because it is self-propelled", "Only when it is driven on the interstate", "Always, whatever it is towing"], "Worksheet #2.", "I.C. 49-1010; ITD POE Size Worksheet p.1"],
  ["size", "Idaho offers a special permit for a reducible (divisible) load up to 11 ft 6 in wide. Which load is this permit for?", "Hay bales", ["Lumber", "Steel coils", "Mobile homes"], "Worksheet #3.", "IDAPA 39.03.01; ITD POE Size Worksheet p.2"],
  ["size", "What is the maximum legal width for a vehicle or load in Idaho without a permit?", '8 ft 6" (8 1/2 ft)', ["8 ft", "10 ft", "9 ft"], "Worksheet #5.", "I.C. 49-1010(1); ITD POE Size Worksheet p.2; ITD DMV/POE Policy Manual 105.12"],
  ["size", "What is the maximum legal height for a vehicle or load in Idaho without a permit?", "14 ft", [`13'6"`, `15'6"`, `14'6"`], "Worksheet #6.", "I.C. 49-1010(2); ITD POE Size Worksheet p.2; ITD DMV/POE Policy Manual 105.12"],
  ["size", "A vehicle runs on an annual non-reducible oversize/overweight permit. What is the maximum height that permit allows?", `15'6"`, [`14'6"`, "16'", "14'"], "Worksheet #7.", "IDAPA 39.03.01.311; ITD POE Size Worksheet p.2"],
  ["size", "A single motor vehicle with no trailer, such as a dump truck, pulls into the port. Without a permit, what is the maximum legal length for that vehicle?", "45 ft", ["40 ft", "48 ft", "53 ft"], "Worksheet #8.", "I.C. 49-1010(3)(a); ITD POE Size Worksheet p.2"],
  ["size", "What is the maximum legal length of a single semitrailer ON the National Network, and OFF the National Network?", "53 ft / 48 ft", ["48 / 45 ft", "53 / 53 ft", "57 / 48 ft"], "Worksheet #8.", "I.C. 49-1010(3)(b); ITD POE Size Worksheet p.2"],
  ["size", "For a tractor pulling two trailers, measured from the front of the first trailer to the rear of the second, what are the legal lengths ON and OFF the National Network?", "68 ft / 61 ft", ["75 / 68 ft", "61 / 61 ft", "65 / 61 ft"], "Worksheets #8, #24.", "I.C. 49-1010(3); ITD POE Size Worksheet p.2, p.7"],
  ["size", "What is the maximum legal overall length of a truck pulling a trailer (truck-and-trailer combination)?", "75 ft", ["65 ft", "61 ft", "80 ft"], "Worksheet #8d.", "I.C. 49-1010(3)(c); ITD POE Size Worksheet p.2"],
  ["size", "A dromedary tractor pulling a trailer does NOT meet the 5-ft stinger-steer rule. What is its maximum legal overall length?", "65 ft", ["75 ft", "61 ft", "70 ft"], "Worksheet #8f (75 ft when it qualifies).", "I.C. 49-1010(3)(h); ITD POE Size Worksheet p.2"],
  ["size", "A power unit is pulling two or more trailers. Does it always need an EL/EW 129,000 lbs permit?", "No, only when legal length (61/75 ft) or legal weight is exceeded", ["Yes, on every interstate trip regardless of size", "No, only when it is pulling three trailers", "Yes, any combination with two or more trailers needs it"], "Worksheet #10.", "I.C. 49-1010(3); ITD POE Size Worksheet p.3"],
  ["size", "On an auto transporter, how far may the load overhang the front and the rear of the vehicle?", "4 ft front and 6 ft rear", ["3 ft front and 4 ft rear", "6 ft front and 4 ft rear", "2 ft front and 8 ft rear"], "Worksheets #11 and Review #2.", "I.C. 49-1010; ITD POE Size Worksheet p.3, p.10"],
  ["size", "To determine whether a load is over legal height, where do you measure?", "From the highest point of the load to the ground", ["From the bottom of the trailer to the top of the load", "From the top of the load to the center of the axle", "From the trailer deck to the top of the load"], "Worksheets #16 and Review #14.", "I.C. 49-1010(2); ITD POE Size Worksheet p.4, p.11"],
  ["size", "A truck sets off the port's over-height warning. What should you do first?", "Look at it; if it appears high, measure it, check permits, then act", ["Measure it, then write a citation without checking permits", "Cite the driver immediately for being over height", "Wave it through, since the sensor is often wrong"], "Worksheet #17.", "ITD POE Size Worksheet p.4"],
  ["size", "A farmer's 14-ft-wide disc is being moved to a shop for repair. In which case is an oversize permit required?", "When the farmer's brother hauls it in his own truck, or a common carrier hauls it", ["When the farmer himself hauls it", "Only when a common carrier hauls it for hire", "Never, because it is an implement of husbandry"], "Worksheet #18.", "I.C. 49-1010(1)(a)-(b); ITD POE Size Worksheet p.5"],
  ["size", "Loads over 10 ft wide, 100 ft long or 15 ft high may NOT travel on which holidays?", "Christmas, Thanksgiving, Labor Day, New Year's, Memorial Day and July 4", ["All federal holidays, including Veterans Day and Columbus Day", "Christmas and New Year's Day only", "There are no holiday travel limits for these loads"], "Worksheet #19.", "IDAPA 39.03.01; ITD POE Size Worksheet p.5"],
  ["size", "Winds over 40 mph are reported at Marsing. What should a permitted oversize load do under the hazardous travel restrictions?", "Park until conditions improve", ["Proceed with pilot cars", "Proceed, because wind is not covered", "Proceed at no more than 30 mph"], "Worksheet #20; General Permit Provisions.", "IDAPA 39.03.01.102.06.d.ii; ITD POE Size Worksheet p.5"],
  ["size", 'Oversize permits require loads to be reduced to "practical minimum dimensions." What does that mean?', "The load must be reduced to the smallest practical size", ["The load must be under legal size", "The vehicle must be measured empty", "The carrier pays the minimum permit fee"], "Worksheet #21.", "IDAPA 39.03.01; ITD POE Size Worksheet p.5"],
  ["size", "May 53-ft single trailers and 68-ft doubles run on ALL red and black routes without an EL/EW permit? Answer yes or no.", "No", ["Yes"], "Worksheet #25: 48 ft trailer; off-track and route color apply.", "I.C. 49-1010(3); ITD POE Size Worksheet p.7"],
  ["size", "Why are some Idaho routes restricted for vehicle length?", "Off-tracking", ["Pavement weight", "Bridge height", "Speed limits"], "Worksheet #27.", "IDAPA 39.03.01.010.15, .201; ITD POE Size Worksheet p.7"],
  ["size", "A carrier holds an Extra Length/Excess Weight (EL/EW) permit for a 129,000 lbs combination and plans a trip on Idaho state highways. Whether the driver must complete and carry an Idaho Off-Track Computation Form depends on what?", "The designated route (state highway) being traveled, per the Statewide EL/EW 129,000 lbs route map, the Route Capacity map, and the Pilot/Escort maps", ["Nothing; it is required for every EL/EW configuration on every route", "Only whether the combination is over 105 ft long", "Only whether the trip is made at night"], 'IDAPA 39.03.01.203.01.a: the form shows compliance with the maximum off-track requirements specified for the designated route being traveled, and is carried "when required." Check the route on the ex129 map, Route Capacity map, and Pilot/Escort maps. When the form is required, the permit is invalid until it is completed and available for inspection.', "IDAPA 39.03.01.203.01.a; ITD Statewide Extra Length/Excess Weight 129,000 lbs Route Map; ITD Route Capacity Map; ITD Pilot/Escort Maps"],
  ["size", "A combination on US-12 between Lewiston and Orofino has a calculated off-track of 5.52 ft, and the route limit is 5.50 ft. Is it legal?", "No, it is over by 0.02 ft", ["Yes, if a pilot car escorts it", "Yes, but only in daylight", "Yes, because it is within rounding"], "Worksheets #29-30.", "IDAPA 39.03.01.201.02.b; ITD POE Size Worksheet p.8"],
  ["size", "A trailer between 8 ft 6 in and 10 ft wide is traveling empty with no special permit. Is this allowed?", "No, it is not allowed", ["Yes, because it is empty", "Yes, but only on the interstate", "Yes, but only in daylight"], "Worksheet #32: permits for up to 10 ft trailers hauling non-divisible loads are valid laden and unladen.", "IDAPA 39.03.01.301.02; ITD POE Size Worksheet p.8"],
  ["size", "A pilot car escorting an oversize load passes an open port without stopping. Is the pilot car exempt from stopping?", "No; cite the pilot car driver", ["Yes, pilot cars are always exempt", "Yes, but only at night", "Yes, while it is escorting a load"], "Worksheet #33.", "IDAPA 39.03.01; ITD POE Size Worksheet p.8"],
  ["size", "Another inspector cleared a vehicle to your port on a warning card so it can buy a permit. What do you do?", "Honor the warning card and sell the permit", ["Sell the permit and also cite the driver", "Hold the vehicle until you verify the warning", "Cite the driver and hold for a supervisor"], "Worksheet #36: consistency between ports.", "ITD POE Size Worksheet p.9"],
  ["size", "When you require a load to be offloaded, should you call the carrier to arrange it? Answer yes or no.", "No; it is the driver's responsibility", ["Yes, always call the carrier"], "Worksheet #37.", "ITD POE Size Worksheet p.9"],
  ["size", "With a permit, what is the maximum length allowed for a reducible (divisible) load?", "115 ft", ["105 ft", "120 ft", "95 ft"], "Worksheets #40 and Review #6: EL permit + route.", "IDAPA 39.03.01.202.01; ITD POE Size Worksheet p.10"],
  ["size", "A load hangs 9 ft beyond the rear of the vehicle. What does it need to be legal?", "Flags or lights, depending on the time of day", ["An oversize permit only", "A pilot car", "Nothing, since it is under 10 ft"], "Review #5.", "I.C. 49-913; ITD POE Size Worksheet p.10"],
  ["size", "After sunset, you stop an oversize vehicle that has no lights on its rear overhang. What are your options?", "Cite and park until sunrise, park for repair, or legalize and proceed", ["Cite the driver and let them proceed as is", "Give a warning and let them proceed", "Escort the vehicle to the state line"], "I.C. 49-913.", "Size study guide (study-guide-2.pdf) Quiz A #21"],
  ["size", "Without a permit, what is the maximum outside width of a farm tractor being transported on the interstate?", "9 feet", ["8 1/2 feet", "10 feet", "12 feet"], "Farm tractor on interstate may not exceed 9 ft except by permit.", "I.C. 49-1010(1)(c)"],
  ["size", "On the National Network (and on access roads within 1 road mile of it), what is the maximum length of a semitrailer?", "53 feet", ["48 feet", "57 feet", "61 feet"], "National network semitrailer: 53 ft.", "I.C. 49-1010(3)(b)3"],
  ["size", "What is the maximum overall length of a motor vehicle pulling one or more trailers?", "75 feet", ["65 feet", "68 feet", "85 feet"], "Motor vehicle and one or more trailers: 75 ft.", "I.C. 49-1010(3)(c)"],
  ["size", "What is the maximum overall length of a stinger-steered dromedary tractor pulling a semitrailer?", "75 feet", ["65 feet", "80 feet", "68 feet"], "Stinger-steered dromedary: 75 ft.", "I.C. 49-1010(3)(f)"],
  ["size", "What is the maximum length of a stinger-steered boat transporter, not counting load overhang?", "75 feet", ["80 feet", "65 feet", "68 feet"], "Boat transporter stinger-steered: 75 ft.", "I.C. 49-1010(3)(i)"],
  ["size", "How far may a load extend beyond the FRONT of a vehicle?", "4 feet", ["3 feet", "6 feet", "10 feet"], "Front overhang: 4 ft.", "I.C. 49-1010(4)(a)"],
  ["size", "How far may a load extend beyond the RIGHT fender of a passenger vehicle?", "6 inches", ["0 inches", "1 foot", "3 inches"], "Right fender: 6 inches.", "I.C. 49-1010(4)(d)"],
  ["size", "On the National Network, what is the maximum overall length of a saddlemount combination?", "97 feet", ["75 feet", "95 feet", "115 feet"], "Saddlemount: 97 ft national network; 75 ft elsewhere.", "I.C. 49-1010(6)(a)"],
  ["size", "Under I.C. 49-1010(7), what is the maximum cargo-carrying length for a truck tractor with two or three trailing units?", "95 feet", ["98 feet", "85 feet", "115 feet"], "Tractor + 2 or 3 trailing units: 95 ft.", "I.C. 49-1010(7)(a), (b)"],
  ["size", "How is the length of a trailer measured?", "From the front of the cargo unit to the rear, excluding load overhang and appurtenances", ["From the front of the cargo unit to the rear, including load overhang", "From the kingpin to the rear bumper", "From the tip of the tongue to the rear bumper"], "Exclusive of all overhang and appurtenances.", "IDAPA 39.03.01 (def. 11)"],
  ["size", "On the day before a holiday, larger permitted loads on black routes may travel only before what time?", "4:00 p.m.", ["2:00 p.m.", "Noon", "6:30 p.m."], "Limited to before 4:00 p.m. on the day preceding a holiday.", "IDAPA 39.03.01.305.02"],
  ["size", "During heavy commuter traffic, loads wider than what are prohibited from traveling?", "13 feet", ["12 feet", "14 feet", "10 feet"], "More than 13 ft wide prohibited at heavy commuter times.", "IDAPA 39.03.01.305.08"],
  ["size", "When must an over-width load display lights at its extremities?", "From 30 minutes after sunset to 30 minutes before sunrise, or when visibility is under 500 ft", ["From sunset to sunrise only", "Only in fog or heavy snow", "From 1 hour after sunset to 1 hour before sunrise"], "30 min after sunset to 30 min before sunrise or visibility < 500 ft.", "IDAPA 39.03.01.104.02; ITD Non-Divisible Oversize/Overweight Permit Attachment 7.2"],
  ["size", "What is the minimum size and design of an OVERSIZE LOAD sign?", "12 in high by 5 ft wide, with 8-in black letters on yellow", ["10 in high by 4 ft wide, with 6-in black letters on yellow", "18 in high by 7 ft wide, with 10-in black letters on yellow", "12 in high by 6 ft wide, with 8-in red letters on white"], `12" x 5', 8" letters, 1" stroke, black on yellow.`, "IDAPA 39.03.01.104.05.a; ITD Non-Divisible Oversize/Overweight Permit Attachment 7.5"],
  ["size", "On the interstate, what is the maximum length of a convoy unit?", "120 feet", ["100 feet", "75 feet", "150 feet"], "100' black, 75' red, 120' interstate.", "IDAPA 39.03.01.304.01-.02; ITD Non-Divisible Oversize/Overweight Permit Attachment 22.1"],
  ["size", "On black and interstate routes, what are the maximum width, height and length allowed under an annual oversize permit?", `16 ft wide, 15'6" high, 120 ft long`, ["14 ft wide, 15 ft high, 110 ft long", "16 ft wide, 16 ft high, 150 ft long", `12'6" wide, 15'6" high, 120 ft long`], `16' wide, 15'6" high, 120' combination incl. overhang.`, "IDAPA 39.03.01.311.01.c; ITD Non-Divisible Oversize/Overweight Permit Attachment 29.1.c"],
  ["size", "Under IDAPA 39.03.01, a building or other overheight load with a loaded height at or above what height may require advance notice if overhead traffic signals are on the route?", `16'6"`, [`15'6"`, "16 feet", `14'6"`], `A loaded height of 16'6" or more may require advance notice when overhead traffic signals are on the route (302.02). Loads over 16'6" must also contact the local utility company about power lines (302.03).`, "IDAPA 39.03.01.302.02"],
  ["size", "An oversize load needs a rear escort when the driver cannot see behind the vehicle for at least how far?", "200 feet", ["500 feet", "100 feet", "1,000 feet"], "Rear escort when the view to the rear is blocked for 200 ft.", "IDAPA 39.03.01.306.12"],
  ["size", "A company is paid to haul farm tractors or implements of husbandry. How is this treated?", "As a common-carrier operation that needs oversize permits", ["As exempt farm equipment", "As exempt if moved in daylight", "As exempt if it is under 12 ft wide"], "Hauling for hire is common-carrier; width exemptions don't apply.", "IDAPA 39.03.01.312.01; ITD Non-Divisible Oversize/Overweight Permit Attachment 30.1"],
  ["size", "A 16-ft-wide manufactured home is being towed. What is the minimum number of axles, and how many of them must have brakes?", "4 axles / brakes on 3", ["3 axles / brakes on 2", "4 axles / brakes on 4", "5 axles / brakes on 3"], "Min 4 axles; brakes on at least 3.", "IDAPA 39.03.01.314.06.f-g; ITD Non-Divisible Oversize/Overweight Permit Attachment 32.6.f, g"],
  ["size", "A driver needs a Class A or B CDL to tow a manufactured home that is wider than what at its base?", "10 feet at the base", [`8'6"`, "12 feet", "14 feet"], "Over 10 ft wide at the base.", "IDAPA 39.03.01.314.07.e; ITD Non-Divisible Oversize/Overweight Permit Attachment 32.7.e"],
  ["size", "An EL/EW 129,000 lbs combination exceeds the I.C. 49-1010 lengths. What are its limits on units, overall length and cargo units?", "4 units, 115 ft overall, 3 cargo units", ["3 units, 105 ft overall, 2 cargo units", "5 units, 120 ft overall, 4 cargo units", "4 units, 95 ft overall, 4 cargo units"], "Not more than 4 units, 115 ft overall, max 3 cargo units.", "IDAPA 39.03.01.202.01; ITD EL/EW 129,000 lbs Special Permit Attachment 15.1"],
  ["size", "Except when passing, what is the minimum distance that must be kept between two EL/EW combinations on the highway?", "500 feet", ["1,000 feet", "300 feet", "200 feet"], "500 ft between combinations.", "IDAPA 39.03.01.202.05.a; ITD EL/EW 129,000 lbs Special Permit Attachment 15.5.a"],
  ["size", "An EL/EW combination is caught over its permitted length or off-track. What happens?", "It is escorted to safe parking, then gets a 1-day single-trip permit with a lead pilot", ["It is sold a 120-hour permit and released", "It is given a warning and released", "It is cited immediately and towed"], "Escorted to safe parking; single-trip one-day permit with advance pilot/escort.", "IDAPA 39.03.01.203.02.b; ITD EL/EW 129,000 lbs Special Permit Attachment 16.2"],
  ["size", "Per the Idaho route chart, what is the maximum off-track allowed on BLACK routes?", "8.75 ft", ["7.50 ft", "6.50 ft", "5.50 ft"], "Black 8.75; Purple 7.50; Red/Dark Blue/Dark Green 6.50.", "ITD Extra Length/Excess Weight up to 129,000 lbs Route Chart (Dec 30, 2025)"],
  ["size", "Per the route chart notes, what is the maximum cargo-carrying length for a full truck pulling two trailers?", "98 feet", ["95 feet", "85 feet", "115 feet"], "Doubles/triples 95 ft; full truck and two trailers 98 ft.", "ITD Extra Length/Excess Weight up to 129,000 lbs Route Chart (Dec 30, 2025) notes"],
  ["size", "A special permit issued by the Idaho Transportation Department covers travel on which roads?", "State roadways only, unless an agreement exists", ["City streets only", "County roads only", "All public roads in Idaho"], "State roadways only; county/city use not granted or implied.", "IDAPA 39.03.01.100.03; ITD Overlegal Permit General Provisions 3.3"],
  ["size", "A permitted oversize load is en route. Its permit becomes invalid when visibility drops below what distance?", "500 feet", ["1,000 feet", "200 feet", "1/4 mile"], "Visibility less than 500 ft due to snow, rain, smoke, dust, fog.", "IDAPA 39.03.01.102.06.d.iii; ITD Overlegal Permit General Provisions 5.6.d.iii"],
  ["size", "During spring breakup, what are the possible maximum axle weight restrictions that may be posted?", "16,000, 14,000, or 12,000 lbs per axle", ["20,000, 16,000, or 12,000 lbs", "14,000, 12,000, or 10,000 lbs", "18,000, 14,000, or 10,000 lbs"], "16,000; 14,000; or 12,000 lbs on any axle.", "IDAPA 39.03.01.106.03; ITD Overlegal Permit General Provisions 9.3"],
  ["size", "When do spring breakup restrictions begin to be enforced?", "The day after signs are posted", ["The day signs are posted", "One week after posting", "Immediately on notice"], "Signs posted the day before; enforced the day after posting.", "IDAPA 39.03.01.106.11; ITD Overlegal Permit General Provisions 9.9"],

  ["haz", "A truck carries 1,200 lbs of Flammable liquid, n.o.s. Which placard is required?", "FLAMMABLE", ["FLAMMABLE LIQUID", "DANGEROUS", "COMBUSTIBLE"], "Class 3 is in Table 2; 1,001 lbs or more needs the placard, which reads FLAMMABLE.", "49 CFR 172.504(e); ITD POE Hazmat & Placards Worksheet p.1"],

  if (action === "restart") { ui.confirmRestart = section; ui.view = "home"; ui.confirmEnd = false; render(); return; }
  if (action === "restart-no") { ui.confirmRestart = null; render(); return; }
  if (action === "restart-yes") { resetSession(section); render(); return; }
  if (action === "review") { ui.active = section; ui.view = "review"; ui.note = ""; render(); scrollTo(0, 0); return; }
  if (action === "dismiss-legacy") { if (P.legacy) P.legacy.dismissed = true; save(); render(); return; }
  if (action === "end") { ui.confirmEnd = true; render(); return; }
  if (action === "end-stay") { ui.confirmEnd = false; render(); return; }
  if (action === "end-yes") {
    ui.confirmEnd = false;
    const g = currentGrade();
    save();
    if (g.status === "pass" || g.status === "needs" || g.status === "done") { ui.view = "review"; render(); scrollTo(0, 0); }
    else { ui.view = "home"; ui.note = ""; render(); scrollTo(0, 0); }
    return;
  }
  if (action === "prev" || action === "next") {
    const sess = sessionOf(ui.active);
    if (!sess) return;
    sess.pos += action === "next" ? 1 : -1;
    if (sess.pos < 0) sess.pos = 0;
    const deck = resolveDeck(sess);
    if (sess.pos >= deck.length) sess.pos = Math.max(0, deck.length - 1);
    ui.note = "";
    save();
    render();
    scrollTo(0, 0);
    return;
  }
  if (action === "finish") {
    const sess = sessionOf(ui.active);
    const deck = resolveDeck(sess);
    const gap = deck.findIndex(it => answerIndex(it, sess) < 0);
    if (gap >= 0 || (ui.active !== "mixed" && !coversAll(deck, ui.active))) {
      if (gap >= 0) sess.pos = gap;
      ui.note = "Still In progress. Answer every question before this quiz can be graded. It is not a pass.";
      save();
      render();
      scrollTo(0, 0);
      return;
    }
    maybeComplete(ui.active);
    save();
    ui.view = "review";
    ui.note = "";
    render();
    scrollTo(0, 0);
    return;
  }
  if (action === "pick") {
    const sess = sessionOf(ui.active);
    const deck = resolveDeck(sess);
    const cur = deck[sess.pos];
    if (!cur || answerIndex(cur, sess) >= 0) return;
    const i = Number(button.dataset.pick);
    if (!cur.opts[i]) return;
    sess.answers[QID(cur)] = cur.opts[i];
    maybeComplete(ui.active);
    ui.note = "";
    save();
    render();
  }
}
function onChange(e) {
  const t = e.target;
  if (t.dataset && t.dataset.shuffle && P.sections[t.dataset.shuffle]) {
    P.sections[t.dataset.shuffle].shuffle = !!t.checked;
    save();
  }
  if (t.id === "mix-filter") { P.mixed.filter = t.value; save(); }
  if (t.id === "mix-shuffle") { P.mixed.shuffle = !!t.checked; save(); }
}
load();
render();
document.getElementById("app").addEventListener("click", onClick);
document.getElementById("app").addEventListener("change", onChange);
window.POE = { QID, ITEMS, SECTIONS, KEY, KEY_V1, KEY_V1_ARCH, PASS_MAX, gradeSection, gradeMixed, migrateV1, state: () => P };
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    if (sessionStorage.getItem("poe-reloaded") === "1") return;
    sessionStorage.setItem("poe-reloaded", "1");
    location.reload();
  });
  setTimeout(() => sessionStorage.removeItem("poe-reloaded"), 4000);
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
}
